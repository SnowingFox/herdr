name: CI

on:
  push:
    branches: ["rustnode/**"]
    paths: ["rustnode/**"]
  pull_request:
    paths: ["rustnode/**"]
  workflow_dispatch:

defaults:
  run:
    working-directory: rustnode

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Verify vendored Node builtins are unmodified
        run: ./tools/verify-libjs.sh

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rustnode

      - name: Format
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Test
        run: cargo test --workspace

      - name: Binding shape contracts
        run: cargo run --release -p rn-compat -- contracts
