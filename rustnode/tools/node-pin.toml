# Node source rustnode is built against.
#
# The JavaScript layer in vendor/libnode-js is copied byte-identical from this
# revision. Bumping the pin means re-copying lib/** and deps/**, and regenerating
# vendor/libnode-js/LIBJS.sha256, all in the same commit.
[node]
repository = "https://github.com/nodejs/node"
commit = "f344e7f552e"
# The vendored lib/ tree, the V8 headers and the test suite come from this
# revision, which reports itself as 28.0.0.
version = "28.0.0"
# The nightly build of this revision. The differential tests compare rustnode
# against a real Node, and that Node has to be this one: a released Node on
# `PATH` is a different engine with a different crypto and URL surface, so
# comparing against it reports a verdict about a runtime rustnode does not
# target. `oracle` is where `tools/fetch-node-oracle.sh` unpacks the tarball and
# is the second place `rn-node-oracle` looks, after `RN_NODE_ORACLE` and before
# `PATH`. It is a directory rather than a file so the platform directory Node's
# own archives use can be derived from `version` instead of being restated here.
oracle = "/tmp/oracle-dl/node-v28.0.0-nightly20261111e8c1160d20-linux-x64"
# What that binary reports to `--version`. It is recorded rather than derived
# because a nightly's version embeds its date and short SHA, and a differential
# test must be able to say exactly which build it compared against. It starts
# with `version`, so the two cannot drift apart: `rn-node-oracle` checks that
# this string names the pinned release, not just any Node 28.
oracle_version = "v28.0.0-nightly20261111e8c1160d20"
# Node 28 is not published yet; the newest released binary is a v27 alpha with
# the same V8 base. Contract recording uses that binary and stamps the
# producing version into each run, so a version difference stays visible
# instead of being silently absorbed.
recorder_version = "v27.0.0-alpha.0.0.0"
v8_version = "15.6.75"
v8_crate = "152.2.0"

[counts]
# `lib/**` and `deps/**` are counted separately because they are separate
# inputs to Node's js2c: `library_files` globs `lib/`, while `deps_files` is an
# explicit list in `node.gyp`. One combined total would let either tree gain a
# file while the other lost one and still balance, so both counts are exact.
builtin_files = 435
# Node's `deps_files` is the list of non-`lib/**` JavaScript that js2c embeds,
# and `lib/**` requires each by its `internal/deps/...` id. rustnode vendors the
# entries that are reachable from `lib/**`:
#
#   deps/undici/undici.js            internal/deps/undici/undici
#   deps/acorn/acorn/dist/acorn.js   internal/deps/acorn/acorn/dist/acorn
#   deps/acorn/acorn-walk/dist/walk.js
#                                    internal/deps/acorn/acorn-walk/dist/walk
#
# acorn is what `internal/repl/*`, `lib/internal/errors/error_source.js` and
# `lib/internal/modules/esm/module_job.js` parse with; without it those modules
# throw `Missing internal module` the first time they are reached, which put
# 126 files in `test/parallel` out of reach.
#
# The eleven `deps/v8/tools/**.mjs` entries stay out: only `--prof-process`
# imports them, through `importBuiltinSourceTextModule`, and that path is not
# built yet. They are a separate gap, deliberately visible rather than counted.
deps_files = 3
internal_binding_namespaces = 73
test_files_parallel = 5161
