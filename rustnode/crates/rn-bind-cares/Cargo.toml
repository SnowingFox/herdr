[package]
name = "rn-bind-cares"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "internalBinding('cares_wrap') for rustnode"

[dependencies]
rn-core.workspace = true
rn-v8-sys.workspace = true
# `getaddrinfo`, `getnameinfo`, `getHostByAddr` and the `query*` methods all
# check the `net` scope, because a DNS lookup is network access. The denial is
# delivered to `oncomplete` as the error object, which is what
# `SET_INSUFFICIENT_PERMISSION_ERROR_CALLBACK` does.
rn-permission = { path = "../rn-permission" }
libc.workspace = true

[dev-dependencies]
# Cross-checks the `UV_EAI_*` codes in `sys.rs` against libuv's own table, so a
# transcription error fails a test instead of changing an error's `code`.
rn-bind-uv = { path = "../rn-bind-uv" }
serde_json.workspace = true
