[package]
name = "rn-quic-vendor-probe"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Feasibility probe: can the vendored ngtcp2/nghttp3 be built and linked here?"
publish = false

[dependencies]

[build-dependencies]
cc = "1"
# The same vendored OpenSSL `rn-bind-crypto` already builds, so this probe
# answers the question against the OpenSSL version the project will actually
# ship rather than whatever headers happen to be on the image.
openssl-src = "=300.6.1+3.6.3"
