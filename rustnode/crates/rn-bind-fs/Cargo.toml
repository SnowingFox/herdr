[package]
name = "rn-bind-fs"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "internalBinding('fs') for rustnode"

[dependencies]
rn-core.workspace = true
rn-permission = { path = "../rn-permission" }
rn-v8-sys.workspace = true
libc.workspace = true
# `ReadFileJob` and `WriteFileJob` are real threadpool jobs: they queue a
