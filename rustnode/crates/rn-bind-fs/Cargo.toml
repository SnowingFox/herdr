[package]
name = "rn-bind-fs"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "internalBinding('fs') for rustnode"

[dependencies]
rn-core.workspace = true
rn-permission = { path = "../rn-permission" }
rn-v8-sys.workspace = true
libc.workspace = true
# `FileHandle.getAsyncId()` answers from the same async-id counter every other
# wrapped resource uses, and that counter lives with the `async_wrap` binding.
rn-bind-async-wrap = { path = "../rn-bind-async-wrap" }
# `ReadFileJob` and `WriteFileJob` are real threadpool jobs: they queue a
# `uv_work_t` on the process loop and deliver `ondone` from it, which needs the
# loop and the re-enter-V8-from-`uv_run` primitive. Both are that crate's.
rn-uv.workspace = true
# Rebuilding a transferred `FileHandle` has to refuse a `vm` context, which is
# Node's `context != env->context()` check. That comparison lives with the
# messaging binding, where the rest of the transfer machinery is.
rn-bind-messaging = { path = "../rn-bind-messaging" }
rn-errors.workspace = true
# `legacyMainResolve` reports `imported from <path>`, and that path is
# `node::url::FileURLToPath`'s answer for the base URL. `rn-bind-url` already owns
# the ada parser and that conversion, so `fs` asks it rather than declaring ada a
# second time.
rn-bind-url = { path = "../rn-bind-url" }
libuv-sys2.workspace = true
tracing.workspace = true

[dev-dependencies]
# The differential tests compare against the pinned Node oracle, not whatever
# `node` `PATH` resolves to; see `tools/node-pin.toml` and `rn-node-oracle`.
rn-node-oracle = { path = "../../tools/node-oracle" }
serde_json.workspace = true
