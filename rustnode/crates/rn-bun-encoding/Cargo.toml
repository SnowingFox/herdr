[package]
name = "rn-bun-encoding"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Bun.YAML/TOML/JSON5/JSONC/JSONL/XML/markdown for rustnode"

[dependencies]
rn-bun-api = { path = "../rn-bun-api" }
rn-core.workspace = true
rn-v8-sys.workspace = true
# The YAML 1.2 core-schema scanner. `saphyr-parser` emits the libyaml event
# stream without committing to a schema, which is what this crate needs: Bun's
# scalar resolution (`yes` stays a string, `.inf` is Infinity) is applied here on
# top of the events, not by the parser. `yaml-rust2` also parses, but it resolves
# and allocates a `Yaml` tree first, so it cannot express the merge-key and
# duplicate-key behaviour without being fought; see the crate docs.
saphyr-parser = "0.0.6"
# GFM parsing for `Bun.markdown`. Byte comparison against Bun showed comrak's
# AST plus a small custom renderer is the only way to match without reimplementing
# CommonMark; see the `markdown` module docs.
comrak = { version = "0.59", default-features = false }

[dev-dependencies]
# The differential tests run the same probe under Bun 1.4.4 and under the built
# runtime, so both binaries have to be locatable from a test.
rn-node-oracle = { path = "../../tools/node-oracle" }
serde_json.workspace = true
serde = { workspace = true }
