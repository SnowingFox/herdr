[package]
name = "rn-bind-url"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "internalBinding('url') for rustnode"

[dependencies]
rn-core.workspace = true
rn-v8-sys.workspace = true
# ada, the library `src/node_url.cc` is actually built on. Node vendors the
# same single-header release (`deps/ada/ada.cpp`), and this crate's bundled copy
# is byte-identical to the one in the Node revision rustnode targets, so the
# parser, the percent-encode sets and every `set_*` guard are the same code
# rather than a second implementation of the same standard. See the crate docs
# for how that equivalence is verified and what it still does not cover.
ada-url = "4.0"

[dev-dependencies]
serde_json.workspace = true
