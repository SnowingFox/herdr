[package]
name = "rn-bind-timers"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "internalBinding('timers') for rustnode"

[dependencies]
# The timer, check and idle handles Node's `Environment` owns for JavaScript
# timers are libuv handles on the loop `rn-uv` owns, so `uv_run` decides when
# they fire.
libuv-sys2.workspace = true
rn-core.workspace = true
rn-errors = { path = "../rn-errors" }
rn-uv.workspace = true
rn-v8-sys.workspace = true
libc.workspace = true
tracing.workspace = true
