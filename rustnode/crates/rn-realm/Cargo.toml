[package]
name = "rn-realm"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "the realm bootstrap shared by the main thread and worker threads"

[dependencies]
rn-bind-crypto = { path = "../rn-bind-crypto" }
# `process.versions.nghttp2` comes from the linked library rather than from a
# pinned string, so the published number names code the binary contains.
rn-bind-http2 = { path = "../rn-bind-http2" }
# `process.versions.sqlite` comes from the linked amalgamation, and the test
# suite derives `hasSQLite` from it.
rn-bind-sqlite = { path = "../rn-bind-sqlite" }
rn-bind-heap-utils = { path = "../rn-bind-heap-utils" }
rn-bind-inspector = { path = "../rn-bind-inspector" }
rn-bind-messaging = { path = "../rn-bind-messaging" }
rn-bind-options = { path = "../rn-bind-options" }
rn-builtins = { path = "../rn-builtins" }
rn-core = { path = "../rn-core" }
# `process.env` is an interceptor over the real environment block, so the block
# itself is shared with `rn-bind-os` (`os.tmpdir`, `os.homedir`) rather than
# copied into a JavaScript object at startup.
rn-env = { path = "../rn-env" }
rn-errors = { path = "../rn-errors" }
# `tzset()` for the `TZ` redetection a `process.env.TZ` write triggers, which is
# the call Node makes before notifying the isolate.
libc.workspace = true
rn-io = { path = "../rn-io" }
rn-module-wrap = { path = "../rn-module-wrap" }
rn-bind-timers = { path = "../rn-bind-timers" }
rn-bind-task-queue = { path = "../rn-bind-task-queue" }
rn-bind-zlib = { path = "../rn-bind-zlib" }
rn-js2c = { path = "../rn-js2c" }
rn-napi = { path = "../rn-napi" }
# `getLinkedBinding` checks the `addon` scope against the module name before it
# reports the binding missing, which is the order `src/node_binding.cc` uses.
rn-permission = { path = "../rn-permission" }
rn-uv = { path = "../rn-uv" }
rn-v8-sys = { path = "../rn-v8-sys" }
v8.workspace = true
