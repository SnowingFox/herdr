[package]
name = "rn-bind-crypto-cipher"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "`CipherBase` and `AESCipherJob` for internalBinding('crypto')"

[dependencies]
rn-core.workspace = true
rn-v8-sys.workspace = true
# The same OpenSSL `rn-bind-crypto` builds and links. `openssl-src` is a single
# artifact in the dependency graph, so this is a new edge onto one library, not a
# second linkage: cargo resolves `openssl-sys` once and every crate calls the
# symbols of that one build.
openssl = { version = "=0.10.82", features = ["vendored"] }
openssl-sys = { version = "=0.9.118", features = ["vendored"] }
libc = { workspace = true }
