[package]
name = "rn-bind-zlib"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "internalBinding('zlib') for rustnode"

[dependencies]
rn-core.workspace = true
rn-v8-sys.workspace = true
# Pure-Rust zlib C ABI: gives deflateParams/deflateSetDictionary/inflateSetDictionary
# with the exact zlib semantics lib/zlib.js relies on, without a C toolchain.
libz-rs-sys = { version = "=0.6.8", default-features = false, features = ["std"] }
# Pure-Rust Brotli encoder/decoder with the streaming BrotliEncoderCompressStream
# equivalent.
brotli = { version = "=8.0.4", default-features = false, features = ["std"] }
brotli-decompressor = { version = "=5.0.3", default-features = false, features = ["std"] }
# zstd, with its C sources vendored in the crate and compiled by cc-rs. Node
# vendors zstd 1.5.7 (`deps/zstd`) and this dependency is pinned to exactly
# `+zstd.1.5.7`, so both sides run the same compressor. There is no pure-Rust
# alternative: `ruzstd` decodes but its encoder levels are unimplemented and it
# has no streaming or dictionary API, which the `ZstdCompress`/`ZstdDecompress`
# handles require. `bindgen` and `legacy` are off because the pregenerated
# bindings are checked in and Node builds zstd without the legacy decoder;
# leaving them off also keeps libclang out of the build.
zstd-sys = { version = "=2.0.17", default-features = false, features = ["zdict_builder"] }

[dev-dependencies]
serde_json.workspace = true
