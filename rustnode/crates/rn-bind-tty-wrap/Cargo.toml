[package]
name = "rn-bind-tty-wrap"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "internalBinding('tty_wrap') for rustnode"

[dependencies]
libuv-sys2.workspace = true
rn-core.workspace = true
# `TTY` is an `AsyncWrap`: its constructor emits the first `init` through
# `internalBinding('async_wrap')`'s hooks, and `getAsyncId` answers from that
# namespace's shared id sequence.
rn-bind-async-wrap = { path = "../rn-bind-async-wrap" }
rn-uv.workspace = true
tracing.workspace = true
rn-v8-sys.workspace = true

[dev-dependencies]
serde_json.workspace = true
