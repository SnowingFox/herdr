[package]
name = "rn-bind-pipe-wrap"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "internalBinding('pipe_wrap') for rustnode"

[dependencies]
libuv-sys2.workspace = true
rn-core.workspace = true
# `Pipe` is an `AsyncWrap` too: its constructor emits the first `init` through
# `internalBinding('async_wrap')`'s hooks, and `getAsyncId` answers from that
# namespace's shared id sequence.
rn-bind-async-wrap = { path = "../rn-bind-async-wrap" }
rn-uv.workspace = true
rn-v8-sys.workspace = true
tracing.workspace = true
# `bind`/`listen`/`connect`/`open`/`fchmod` check the `net` scope, which the
# process's one model answers through `rn_permission::runtime`.
rn-permission = { path = "../rn-permission" }

[dev-dependencies]
serde_json.workspace = true
