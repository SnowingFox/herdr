[package]
name = "rn-bind-messaging"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "internalBinding('messaging') for rustnode"

[dependencies]
rn-core.workspace = true
rn-bind-symbols = { path = "../rn-bind-symbols" }
# A `MessagePort` whose peer is in another isolate must wake that thread's loop,
# and `uv_async_send` is the only portable way to do it. The handle's life is
# owned there, not here, so this is the wake token and nothing else.
rn-uv.workspace = true
rn-v8-sys.workspace = true
v8.workspace = true

[dev-dependencies]
serde_json.workspace = true
