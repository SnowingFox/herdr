[package]
name = "rn-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "rustnode executable"

[[bin]]
name = "rustnode"
path = "src/main.rs"

[dependencies]
rn-util = { path = "../rn-util" }
rn-module-wrap = { path = "../rn-module-wrap" }
rn-bind-heap-utils = { path = "../rn-bind-heap-utils" }
rn-errors = { path = "../rn-errors" }
rn-builtins = { path = "../rn-builtins" }
rn-js2c = { path = "../rn-js2c" }
rn-core = { path = "../rn-core" }
# The CLI owns what the command line means, and `lib/**` reads it back through
# `internalBinding('options')`. Parsing happens here so there is one authority
# for the argv rather than two that can disagree.
rn-bind-options = { path = "../rn-bind-options" }
rn-bindings = { path = "../rn-bindings" }
# `process.permission` and the native checks share one model, which the CLI
# builds from `--permission` and the `--allow-*` flags and installs before the
# registry is created.
rn-permission = { path = "../rn-permission" }
# `process.versions.openssl` has to report the version this binary actually
# linked, so the CLI reads it from the crypto binding rather than hardcoding.
rn-bind-crypto = { path = "../rn-bind-crypto" }
rn-module = { path = "../rn-module" }
rn-io = { path = "../rn-io" }
# The realm bootstrap is shared with worker threads: a worker is a second isolate
# running the same `internal/bootstrap/realm.js` sequence, so it has to be one
# implementation rather than a copy that can drift.
rn-realm = { path = "../rn-realm" }
# `process.versions.uv` reports the libuv this binary linked, which `rn-uv`
# reads from `uv_version_string` rather than from a manifest.
rn-uv = { path = "../rn-uv" }
rn-bind-timers = { path = "../rn-bind-timers" }
# `--inspect` starts the inspector's WebSocket endpoint, and the loop drains the
# messages its reader threads queue.
rn-bind-inspector = { path = "../rn-bind-inspector" }
rn-bind-task-queue = { path = "../rn-bind-task-queue" }
# The entry point runs inside an `InternalCallbackScope` whose async context is
# `{ 1, 0 }` (`src/node.cc:287`), and that scope lives with `async_wrap`'s
# state. Opening it here is what makes top-level `triggerAsyncId()` answer 1.
rn-bind-async-wrap = { path = "../rn-bind-async-wrap" }
rn-bind-messaging = { path = "../rn-bind-messaging" }
# A worker's exit is reported from the parent's check phase, so the CLI wires
# that hook when it installs the loop.
rn-bind-worker = { path = "../rn-bind-worker" }
rn-napi = { path = "../rn-napi" }
# `process.versions.zlib` and `.zstd` come from the libraries the binary
# actually links, so the CLI asks those bindings rather than restating a
# version string in two places.
rn-bind-zlib = { path = "../rn-bind-zlib" }
rn-v8-sys = { path = "../rn-v8-sys" }
tracing.workspace = true
tracing-subscriber.workspace = true
