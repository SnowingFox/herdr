[package]
name = "rn-module-wrap"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "internalBinding('module_wrap') for rustnode"

[dependencies]
rn-core.workspace = true
rn-v8-sys.workspace = true
rn-bind-symbols = { path = "../rn-bind-symbols" }
# `ThrowIfPromiseRejected` and `evaluateSync` withdraw a rejected evaluation
# promise from unhandled-rejection tracking before they throw, exactly as
# `src/module_wrap.cc` does through the realm's promise reject callback. That
# callback is `task_queue`'s, so the call goes through it rather than through a
# second copy of the JavaScript protocol.
rn-bind-task-queue = { path = "../rn-bind-task-queue" }
