[package]
name = "rn-bind-tcp-wrap"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "internalBinding('tcp_wrap') for rustnode"

[dependencies]
libuv-sys2.workspace = true
rn-core.workspace = true
rn-uv.workspace = true
# `asyncReset` emits `init`/`destroy` through `internalBinding('async_wrap')`'s
# registered hooks, and `getAsyncId` answers from the id space that namespace's
# counter advances. A private counter here would hand out ids a hook never saw.
rn-bind-async-wrap = { path = "../rn-bind-async-wrap" }
# `bind`/`listen`/`connect`/`open` check the `net` scope, which the process's one
# model answers through `rn_permission::runtime`.
rn-permission = { path = "../rn-permission" }
tracing.workspace = true
rn-v8-sys.workspace = true

[dev-dependencies]
serde_json.workspace = true
