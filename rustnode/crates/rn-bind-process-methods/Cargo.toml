[package]
name = "rn-bind-process-methods"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "internalBinding('process_methods') for rustnode"

[dependencies]
# `process.reallyExit` has to know whether this realm is the main thread: in a
# worker it may only end the realm, never the process. The worker namespace is
# where that fact lives, and it is already a dependency of nothing here, so this
# is a leaf-to-leaf edge with no cycle.
rn-bind-worker = { path = "../rn-bind-worker" }
rn-core.workspace = true
rn-v8-sys.workspace = true
# `process.dlopen` is the addon loader's public entry point, so this namespace
# owns the call into rn-napi rather than the CLI threading it through.
rn-napi = { path = "../rn-napi" }
# `process.reallyExit` is where Node stops the libuv threadpool before the C
# runtime's exit sequence frees the state a running job is still using, so the
# drain has to happen here rather than in a destructor.
rn-uv.workspace = true
libc.workspace = true
