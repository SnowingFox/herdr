[workspace]
resolver = "2"
members = [
    "crates/rn-v8-sys",
    "crates/rn-core",
    "crates/rn-io",
    "crates/rn-bindings",
    "crates/rn-module",
    "crates/rn-napi",
    "crates/rn-cli",
    "tools/contract-gen",
    "tools/compat",
    "tools/harness",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
license = "MIT"
repository = "https://github.com/SnowingFox/herdr"

[workspace.dependencies]
v8 = "152.2.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
libc = "0.2"
parking_lot = "0.12"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
panic = "abort"
