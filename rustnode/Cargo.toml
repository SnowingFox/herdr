[workspace]
resolver = "2"
# Glob members so every parallel workstream owns its own crate directory and
# never edits this file. Adding a crate means adding one directory.
#
# The exclusions are not cosmetic: a cargo member glob requires every matching
# directory to hold a Cargo.toml, so a stray `tools/__pycache__` from importing
# one of the Python tools fails the whole workspace with a missing manifest.
# Python and the test cache both write there, so they are named explicitly.
members = ["crates/*", "tools/*"]
exclude = [
    "vendor",
    "tools/__pycache__",
    "tools/harness/results",
    "tools/compat/target",
    "tools/contract-gen/target",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
license = "MIT"
repository = "https://github.com/SnowingFox/herdr"

[workspace.dependencies]
v8 = "152.2.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
libc = "0.2"
# East-Asian Width and general-category data, which is what
# `icu.getStringWidth` needs for `util.inspect` column counting.
unicode-width = "0.2"
parking_lot = "0.12"
rn-v8-sys = { path = "crates/rn-v8-sys" }
rn-core = { path = "crates/rn-core" }
rn-uv = { path = "crates/rn-uv" }
# libuv, linked as a static library built from the crate's own vendored source.
# `net`, `http` and everything below them expect libuv handle semantics exactly
# (write queues, `UV_EOF`, connect completions, handle refs), so the real library
# is what the socket namespaces are built on rather than a reimplementation.
libuv-sys2 = "=1.53.1"
rn-io = { path = "crates/rn-io" }
rn-bindings = { path = "crates/rn-bindings" }
rn-module = { path = "crates/rn-module" }
rn-napi = { path = "crates/rn-napi" }
rn-permission = { path = "crates/rn-permission" }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
panic = "abort"
